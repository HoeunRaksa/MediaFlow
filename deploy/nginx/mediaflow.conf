# Flutter Web static site on the requested app port.
server {
    listen 13000;
    listen [::]:13000;
    server_name media.learner-teach.online;

    root /var/www/mediaflow/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# Public HTTP entry point for the domain. Certbot can add HTTPS after DNS
# resolves to this server and inbound TCP 80/443 are open.
server {
    listen 80;
    listen [::]:80;
    server_name media.learner-teach.online;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
