<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Construction material quotations and room calculators.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111217" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root { color-scheme: light dark; }
    html, body { width: 100%; height: 100%; height: 100dvh; margin: 0; overflow: hidden; background: #F2F3F7; overscroll-behavior: none; }
    body { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
    #flutter_view { width: 100%; height: 100%; }
    #launch { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; font: 16px -apple-system, BlinkMacSystemFont, sans-serif; color: #172A48; }
    #launch img { width: 80px; height: 80px; margin: 0 auto 18px; border-radius: 20px; }
    @media (prefers-color-scheme: dark) { html, body { background: #111217; } #launch { color: #EDEEF4; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Material Quote">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Material Quote Pro</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="launch" role="status"><img src="icons/apple-touch-icon.png" alt=""><span>Material Quote Pro</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () { document.getElementById('launch')?.remove(); });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async fetchpriority="high"></script>
</body>
</html>
